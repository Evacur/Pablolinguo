# Same checks as the Vercel build, visible on GitHub: a red mark on the commit or the pull request.
name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests and build (design system, backend, answers, store)
        run: npm run build
      - name: Migrations already in main are never changed
        run: scripts/check-migrations.sh ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
